      background-color: #ECF4FF;

    main {
      min-height: 100vh;

      justify-content: center;

    #gender {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    .form__field {
      width: 100%;
      height: var(--input-height);
      padding: 10px;
      border: 1px solid var(--input-border-color);
      border-radius: var(--input-border-radius);
    }

    .form__text {
      font-size: 16px;
      color: var(--font-default-color);
    }

    .form__title {
      line-height: 1.75;
      font-weight: 600;
    }

    .radio-button__wrapper {
      padding: 10px;
      position: relative;
      cursor: pointer;
      margin-bottom: 5px;
      background-color: #fff;
    }

    .radio-button__wrapper:hover .radio-button__item {
      box-shadow: 0 0 3px 0 #0682de;
    }

    .radio-button__wrapper input {
      cursor: pointer;
      height: 0px;
      opacity: 0;
      position: absolute;
      width: 0px;
      margin: 0px;
    }

    .radio-button__item {
      height: 20px;
      width: 20px;
      position: absolute;
      top: 50%;
      left: 10px;
      transform: translateY(-50%);
      border-radius: 12px;
      border: solid 1px rgba(62, 61, 64, 0.5);
      background-color: #f2f2f2;
    }

    .radio-button__item::after {
      content: "";
      position: absolute;
      display: none;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--base-focus-color);
      border: solid var(--base-focus-color);
    }

    .radio-button__wrapper input:checked~.radio-button__item::after {
      display: block;
    }

    .radio-button__wrapper input:checked~.radio-button__title {
      font-weight: 600;
      color: #000000;
    }

    .radio-button__title {
      padding-left: 30px;
      font-size: 16px;
      line-height: 31px;
    }

    .radio-button__wrapper:focus-within,
    #birthday:focus-within,
    #birthday:focus {
      outline: 0;
      border-color: var(--base-focus-color);
    }

    .birthday__icon-wrapper {
      padding: 10px;
      background-color: white;
      position: absolute;
      top: 41px;
      transform: translateY(-50%);
      right: 1px;
      pointer-events: none;
    }

    [type="date"]::-webkit-calendar-picker-indicator {
      width: 24px;
      height: 24px;
      opacity: 0;
    }

    [type="date"]::-webkit-date-and-time-value {
      text-align: left;
    }

    .birthday__icon {
      width: 24px;
      height: 24px;
      display: block;
      fill: var(--icon-default-color);
    }

    .birthday__label {
      position: absolute;

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      (function () {
        const POP_ID = 'password-security-popover';
        const PWD_SELECTOR = 'input[type="password"], input[name="password"], input#password';

        const pop = document.getElementById(POP_ID);
        if (!pop) return;
        let pwd = document.querySelector(PWD_SELECTOR);
        function collectBaseline() {
          const items = Array.from(pop.querySelectorAll('ul ul > li'));
          const map = new Map();
          items.forEach(li => map.set(li, li.className || ''));
          return map;
        }
        let baseline = collectBaseline();


        function liHasChanged(li) {
          const base = baseline.get(li);
          if (base === undefined) {
            baseline.set(li, li.className || '');
            return false;
          }
          return (li.className || '') !== (base || '');
        }


        function refreshByClassDiff() {
          const items = Array.from(pop.querySelectorAll('ul ul > li'));
          items.forEach(li => {
            if (liHasChanged(li)) li.setAttribute('aria-checked', 'true');
            else li.removeAttribute('aria-checked');
          });
        }


        function runChecksWithRetries(retries = 4, delay = 120) {
          refreshByClassDiff();
          if (retries <= 0) return;
          let attempts = 0;
          const id = setInterval(() => {
            attempts++;
            refreshByClassDiff();
            if (attempts >= retries) clearInterval(id);
          }, delay);
        }

        function onInput() {
          const started = !!(pwd && pwd.value && pwd.value.length > 0);
          pop.classList.toggle('show-on-input', started);

          if (!started) {
            Array.from(pop.querySelectorAll('ul ul > li[aria-checked]')).forEach(li => li.removeAttribute('aria-checked'));
            return;
          }
          runChecksWithRetries(4, 100);
        }


        if (pwd) {
          pwd.addEventListener('input', onInput);
          pwd.addEventListener('blur', onInput);
        } else {

          let attempts = 0;
          const findInterval = setInterval(() => {
            attempts++;
            const found = document.querySelector(PWD_SELECTOR);
            if (found) {
              pwd = found;
              pwd.addEventListener('input', onInput);
              pwd.addEventListener('blur', onInput);
              clearInterval(findInterval);
            } else if (attempts > 40) {
              clearInterval(findInterval);
            }
          }, 100);
        }

        baseline = collectBaseline();
        if (pwd && pwd.value && pwd.value.length) onInput();


        window.__stopPasswordPopoverClassWatcher = function () {
          try { if (pwd) { pwd.removeEventListener('input', onInput); pwd.removeEventListener('blur', onInput); } } catch (e) { }
        };
      })();
    });
    // password security popover logic end//
  </script>

  <script>
    // check page views
    document.addEventListener("DOMContentLoaded", function () {
      const isLoginPage = window.location.href.includes("/login");
      const isRegistrationPage = window.location.href.includes("/signup");
      const isResetPasswordPage =
        window.location.href.includes("/reset-password");
      let formSubmitted = false; // Flag to track form submission

      // check page views and if form is submitted
      if (isRegistrationPage) {
        // Call your DataLayerPush function with the appropriate parameters


        // Use DataLayerPush to track form view
        DataLayerPush(
          "event_crm_action",
          "event_profile_register_view_form",
          "register_header_button",
          true
        );

        // Find any form on the registration page
        const forms = document.querySelectorAll("form");
        forms.forEach(function (form) {
          form.addEventListener("submit", function () {
            formSubmitted = true; // Set flag to true on form submission
          });
        });
      }

      // event_profile_login / event_profile_register are now fired from the
      // submit CTA handlers below together with their success/failure status,
      // so the unconditional (status-less) pushes have been removed here to
      // avoid inflating the event count.

    // submission error tracking
    function findInputForError(errorNode) {
        var validationTarget = errorNode.getAttribute("data-ulp-validation-target");
        if (validationTarget) return document.querySelector("#" + validationTarget);
        return errorNode.closest(".ulp-field")?.querySelector("input") || errorNode.closest(".input-wrapper")?.querySelector("input");
      }

      function pushSubmitError(errorNode, action) {
        var errorMessage = errorNode.textContent.trim();
        if (!errorMessage) return;
        var closestInput = findInputForError(errorNode);
        var fieldName = closestInput ? (closestInput.name || closestInput.id || "") : "";
        if (!fieldName) return;
        var errorType = (closestInput && closestInput.value === "") ? fieldName + ".field_missing" : fieldName + ".validation_error";

        window.dataLayer.push({
          event: "customEvent",
          GAeventAction: action,
          GAeventCategory: "event_form_action",
          GAeventLabel: "form_action_button",
          GAeventNonInteraction: false,
          GAeventValue: 0,
          error_type: errorType,
          error_message: errorMessage
        });
      }

      function collectAndPushErrors() {
        var action = isLoginPage ? "event_profile_login_submit_error" : "event_profile_register_submit_error";
        document.querySelectorAll("[data-error-code]").forEach(function (errorNode) {
          if (errorNode.offsetParent === null && errorNode.style.display === "none") return;
          pushSubmitError(errorNode, action);
        });
        document.querySelectorAll('.ulp-error-info[data-is-error="true"]').forEach(function (errorNode) {
          pushSubmitError(errorNode, action);
        });
      }

      // check for errors on page load
      collectAndPushErrors();

      // check for errors on submit
      var submitButton = document.querySelector('button[type="submit"][name="action"][value="default"]:not([aria-hidden="true"])');
      if (submitButton) {
        submitButton.addEventListener("click", function () {
          setTimeout(collectAndPushErrors, 300);
        });
      }
    });  

    // GA events for buttons and a tags
    document.addEventListener("DOMContentLoaded", function () {
      // Select the 'register' link
      var registerLink = document.querySelector('a[href*="/u/signup"]');
      // Select the 'login' link
      var loginLink = document.querySelector('a[href*="/u/login"]');
      // Add click event listener to the register button
      if (registerLink) {
        registerLink.addEventListener("click", function () {
          DataLayerPush(
            "event_crm_action",
            "event_profile_register_view_form",
            "register_header_button",
            true
          );
        });
      }
      // Add click event listener to the 'login' link
      if (loginLink) {
        loginLink.addEventListener("click", function () {
          DataLayerPush(
            "event_crm_action",
            "event_profile_login",
            "register_header_button",
            true
          );
        });
      }
    });
    document.addEventListener("DOMContentLoaded", function () {
      if (window.location.href.includes("mfa-sms-enrollment") && !window.location.href.includes("mfa-sms-enrollment-verify")) {
        const h1Element = document.querySelector('h1');
        if (h1Element) {
          const h2Element = document.createElement('h2');
          h2Element.textContent = "Pourquoi demandons-nous un numéro de mobile ?";
          h2Element.style.fontSize = "18px";
          h2Element.style.fontWeight = "600";
          h1Element.insertAdjacentElement('afterend', h2Element);
        }
      } else if (window.location.href.includes("mfa-sms-enrollment-verify")) {
        const desc = document.getElementById("aria-description-text");
        if (desc) {
          desc.style.display = "none";
        }
        const h1 = document.querySelector("header h1");
        if (h1) {
          h1.style.textAlign = "left";
          h1.style.fontSize = "16px";
          h1.style.margin = "10px";
        }
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      if (!window.location.pathname.includes("mfa-sms-enrollment")) return;

      const countryButton = document.querySelector(
        'button[name="action"][value="pick-country-code"]'
      );

      if (countryButton) {
        if (!document.getElementById("country-prefix-label")) {
          const label = document.createElement("label");
          label.id = "country-prefix-label";
          label.className = "mfa-label";
          label.innerHTML = `Indicatif du pays <span class="required">*</span>`;
          countryButton.parentNode.insertBefore(label, countryButton);
        }
      }
      const phoneLabel = document.querySelector('label[for="phone"]');
      if (phoneLabel) {
        phoneLabel.classList.add("mfa-label");
        phoneLabel.innerHTML = `Entrez votre numéro de téléphone <span class="required">*</span>`;
        phoneLabel.style.setProperty("top", "-20px");
        phoneLabel.style.setProperty("left", "-7px", "important");
        phoneLabel.style.setProperty("background", "transparent");
        phoneLabel.style.setProperty("color", "#000");
        phoneLabel.style.setProperty("margin-top", "10px");
        document.querySelector(".ulp-field").style.marginTop = "28px";
      }
    });

  <script>
    const form = document.querySelector('form')

    const removeErrorMessage = (field) => {
      const wrapper = field.closest("div")
      const children = Object.values(wrapper.children);
      const errorElement = children.filter((node) => node.id == 'error-element')[0]
      field.style = 'border-color:#172E20;'
      if (errorElement) {
        errorElement.remove();
      }
    }

    function createErrorTemplate() {
      // Create the parent span element
      const errorTemplate = document.createElement('span');
      errorTemplate.id = 'error-template';
      errorTemplate.className = 'ulp-input-error-message';
      errorTemplate.dataset.errorCode = 'custom-script-error-code_extensibility_error';
      errorTemplate.style.display = 'none';

      // Create the inner span for the icon
      const errorIcon = document.createElement('span');
      errorIcon.className = 'ulp-input-error-icon';
      errorIcon.setAttribute('role', 'img');
      errorIcon.setAttribute('aria-label', 'Mistake');

      // Append the icon span to the parent
      errorTemplate.appendChild(errorIcon);

      // Create the font structure
      const outerFont = document.createElement('font');
      outerFont.style.verticalAlign = 'inherit';

      const innerFont = document.createElement('font');
      innerFont.style.verticalAlign = 'inherit';
      innerFont.id = 'password-error';

      // Nest the fonts and append them to the parent
      outerFont.appendChild(innerFont);
      errorTemplate.appendChild(outerFont);

      return errorTemplate;
    }

    function getErrorMessageFromErrorInfo(id) {
      const element = document.getElementById(id);
      if (!element || !element.textContent) {
        return 'Required Field';
      }
      return element.textContent.trim().replace(/\s+/g, ' ');
    }

    const addErrorMessage = (message, field) => {
      const wrapper = field.closest("div")
      field.style = 'border-color:red;'

      const errorElement = createErrorTemplate().cloneNode(true);
      errorElement.id = 'error-element'

      const errorText = errorElement.children[1].children[0]
      errorText.innerText = message;
      errorElement.style = 'display:flex;'
      wrapper.append(errorElement);
    }

    const addErrorMessageRadioButton = (message, menButton, womenButton, otherButton) => {
      addErrorMessage(message, menButton);
      menButton.parentNode.id = 'radio-error';
      womenButton.parentNode.id = 'radio-error';
      otherButton.parentNode.id = 'radio-error';
    }

    const addErrorMessagePassword = (message) => {
      const passwordField = document.querySelector('div.password');
      const passwordWrapper = passwordField.parentElement;

      passwordField.style = 'border-color:red;'
      const errorElement = createErrorTemplate().cloneNode(true);
      errorElement.id = 'error-element';
      const errorText = errorElement.children[1].children[0]

      errorText.innerText = message;
      errorElement.style = 'display:flex;'
      passwordWrapper.append(errorElement);
    }

    const removeErrorMessagePassword = () => {
      const passwordField = document.querySelector('div.password');
      const passwordWrapper = passwordField.parentElement;
      const children = Object.values(passwordWrapper.children);
      const errorElement = children.filter((node) => node.id == 'error-element')[0]
      passwordField.style = 'border-color:#172E20;'
      if (errorElement) {

        errorElement.remove();
      }
    }

    const removeErrorMessageRadioButton = (menButton, womenButton, otherButton) => {
      removeErrorMessage(menButton);
      menButton.parentElement.id = '';
      womenButton.parentElement.id = '';
      otherButton.parentElement.id = '';
    }

    const validateBirthDay = () => {
      const birthDateField = document.querySelector('input#birthday');
      removeErrorMessage(birthDateField);

      if (birthDateField.value == '') {
        addErrorMessage(getErrorMessageFromErrorInfo('id-error-birthday-container'), birthDateField)
        return false;
      } else {
        const birthDateValue = new Date(birthDateField.value);
        const today = new Date();
        let age = today.getFullYear() - birthDateValue.getFullYear();
        const m = today.getMonth() - birthDateValue.getMonth();
        if (m < 0 || (m === 0 && today.getDate() < birthDateValue.getDate())) {
          age--;
        }
        if (age < 18) {
          const errorMessage = 'vous devez avoir au moins 18 ans pour vous inscrire';
          addErrorMessage(errorMessage, birthDateField);
          birthDateField.focus();
          return false;
        }
        else {
          removeErrorMessage(birthDateField);
          return true;
        }
      }
      return true;
    }

    const validateLastName = () => {
      const lastName = document.querySelector("#lastName");
      let isLastNamevalid = true;

      if (lastName) {
        removeErrorMessage(lastName);
        if (lastName.value == '') {
          addErrorMessage(getErrorMessageFromErrorInfo('id-error-last-name-container'), lastName);
          isLastNamevalid = false;
        }
      }
      return isLastNamevalid;
    }

    const validateFirstName = () => {
      const firstName = document.querySelector("#firstName");
      let isFirstNamevalid = true;
      if (firstName) {
        removeErrorMessage(firstName);
        if (firstName.value == '') {
          addErrorMessage(getErrorMessageFromErrorInfo('id-error-first-name-container'), firstName);
          isFirstNamevalid = false;
        }
      }

      return isFirstNamevalid;
    }

    const validateGender = () => {
      const womenButton = document.querySelector("#female");
      const menButton = document.querySelector("#male");
      const otherButton = document.querySelector("#prefer-not-to-say");

      if (womenButton && menButton && otherButton) {
        removeErrorMessageRadioButton(menButton, womenButton, otherButton);
        if (womenButton.checked || menButton.checked || otherButton.checked) {
          return true;
        }
        else {
          addErrorMessageRadioButton(getErrorMessageFromErrorInfo('id-error-gender-select-container'), menButton, womenButton, otherButton);
          return false
        }
      }
      return true;
    }

    const validateEmailFormat = (email) => {
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return emailRegex.test(email);
    }

    const validateEmailAddress = (email) => {

      if (!email)
        return false;

      removeErrorMessage(email);
      let isEmailEmpty = email.value == '';
      if (isEmailEmpty || !validateEmailFormat(email.value)) {
        let errMsg = getErrorMessageFromErrorInfo('error-cs-email-required');
        addErrorMessage(errMsg, email);
        return false
      }
      return true;
    }

    const validatePassword = (password) => {
      if (!password)
        return false;

      removeErrorMessagePassword(password);
      if (password.value != '')
        return true;

      addErrorMessagePassword(getErrorMessageFromErrorInfo('error-cs-password-required'), password)
      return false;
    }

    const birthDateField = document.querySelector('input#birthday');
    const firstName = document.querySelector('input#firstName');
    const lastName = document.querySelector('input#lastName');
    const menField = document.querySelector("#male");
    const womenField = document.querySelector("#female");
    const otherField = document.querySelector("#prefer-not-to-say");
    const email = document.querySelector("input#email");
    const password = document.querySelector("input#password");

    // Function to trigger the DataLayer push (registration complete)
    function triggerDataLayerPush() {
      DataLayerPush(
        "event_crm_action",
        "event_profile_register_complete",
        "register_action_button",
        true
      );
    }

    const submitButton = document.querySelector('button[type="submit"][name="action"][value="default"]:not([aria-hidden="true"])')
    submitButton.addEventListener("click", (event) => {
      const isBirthdayValid = validateBirthDay();
      const isFirstNameValid = validateFirstName();
      const isLastNameValid = validateLastName();
      const isGenderValid = validateGender();
      const isEmailValid = validateEmailAddress(email);
      const isPasswordValid = validatePassword(password);
      const isCredsValid = isEmailValid && isPasswordValid;
      const isValid = isBirthdayValid && isFirstNameValid && isLastNameValid && isGenderValid && isCredsValid

      // Client-side validation error on CTA click -> registration_status: failure
      if (!isValid) {
        event.preventDefault();
        DataLayerPush(
          "event_crm_action",
          "event_profile_register",
          "register_action_button",
          false,
          { registration_status: "failure" }
        );
      }
    })

    // Form is valid and actually submitted -> registration_status: success
    if (form) {
      form.addEventListener("submit", () => {
        DataLayerPush(
          "event_crm_action",
          "event_profile_register",
          "register_action_button",
          false,
          { registration_status: "success" }
        );
        triggerDataLayerPush();
      });
    }

    email.addEventListener('input', () => {
      validateEmailAddress(email);
    })

    password.addEventListener('input', () => {
      validatePassword(password);
    })

    birthDateField.addEventListener('change', () => {
      validateBirthDay();
    })

    firstName.addEventListener('input', () => {
      validateFirstName();
    })

    lastName && lastName.addEventListener('input', () => {
      validateLastName();
    })

    womenField && womenField.addEventListener('change', () => {
      validateGender();
    })

    menField && menField.addEventListener('change', () => {
      validateGender();
    })

    otherField && otherField.addEventListener('change', () => {
      validateGender();
    })

    // Auth0 server-side error hook (registration).
    // After a client-side-valid submit, Auth0 re-renders the signup page with a
    // field-level error when the email is already registered. On this tenant that
    // is rendered as:
    //   <span id="error-element-email" data-error-code="email-in-use">...</span>
    // Fire a failure event so the earlier success (attempt) is paired with the
    // server-side failure.
    document.addEventListener("DOMContentLoaded", function () {
      const emailErrorNode = document.getElementById("error-element-email");
      if (
        emailErrorNode &&
        emailErrorNode.nodeType === 1 &&
        emailErrorNode.getAttribute("data-error-code") === "email-in-use"
      ) {
        DataLayerPush(
          "event_crm_action",
          "event_profile_register",
          "register_action_button",
          false,
          { registration_status: "failure_existingemail" }
        );
        return;
      }

      // Generic server-side error banner hook (any other registration error).
      const errorNode = document.getElementById("prompt-alert");
      if (!errorNode || errorNode.nodeType !== 1 || !errorNode.hasAttribute("data-error-code")) {
        return;
      }
      DataLayerPush(
        "event_crm_action",
        "event_profile_register",
        "register_action_button",
        false,
        { registration_status: "failure" }
      );
    });
  </script>
  {% endif %}
  {% if prompt.name == "login"%}
  <script>
    const loginForm = document.querySelector('form');
    const LoginsubmitButton = document.querySelector('button[type="submit"][name="action"][value="default"]:not([aria-hidden="true"])')
    LoginsubmitButton.addEventListener("click", (event) => {
      // Determine client-side login form completion using the form's own required
      // fields (native validation) instead of guessing field IDs/names, which can
      // differ per tenant/screen.
      let isLoginFormValid = true;
      if (loginForm) {
        const requiredFields = loginForm.querySelectorAll("input[required], input[aria-required='true']");
        if (requiredFields.length > 0) {
          isLoginFormValid = Array.prototype.every.call(
            requiredFields,
            function (field) { return field.value.trim() !== ""; }
          );
        }
      }

      // Client-side completion error (empty field) on CTA click -> login_status: failure
      if (!isLoginFormValid) {
        DataLayerPush(
          "event_crm_action",
          "event_profile_login",
          "login_action_button",
          false,
          { login_status: "failure" }
        );
      }
    });

    // Form filled out and submitted to Auth0 -> login_status: success
    if (loginForm) {
      loginForm.addEventListener("submit", () => {
        DataLayerPush(
          "event_crm_action",
          "event_profile_login",
          "login_action_button",
          false,
          { login_status: "success" }
        );

        DataLayerPush(
          "event_crm_action",
          "event_profile_login_complete",
          "login_action_button",
          true
        );
      });
    }

    // Server-side login error tracking (e.g. wrong email or password).
    // After a client-side-valid submit, Auth0 re-renders the login page with a
    // field-level error element. On this tenant wrong credentials are rendered as:
    //   <span id="error-element-password" data-error-code="wrong-email-credentials">...</span>
    // When present, fire a failure event so the earlier success (attempt) is
    // paired with the server-side failure (rejected credentials).
    document.addEventListener("DOMContentLoaded", function () {
      const credentialErrorNode = document.getElementById("error-element-password");
      if (
        credentialErrorNode &&
        credentialErrorNode.nodeType === 1 &&
        credentialErrorNode.getAttribute("data-error-code") === "wrong-email-credentials"
      ) {
        DataLayerPush(
          "event_crm_action",
          "event_profile_login",
          "login_action_button",
          false,
          { login_status: "failure" }
        );
        return;
      }

      // Generic server-side error banner hook (any other login error).
      const errorNode = document.getElementById("prompt-alert");
      if (!errorNode || errorNode.nodeType !== 1 || !errorNode.hasAttribute("data-error-code")) {
        return;
      }
      DataLayerPush(
        "event_crm_action",
        "event_profile_login",
        "login_action_button",
        false,
        { login_status: "failure" }
      );
    });
  </script>

  <!-- MFA Resend Code Cooldown Timer -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const RESEND_COOLDOWN_SEC = 60; // Adjust cooldown duration here
      const url = window.location.href;

      // Only run on MFA verify/challenge pages
      if (!url.includes("mfa-sms-enrollment-verify") && !url.includes("mfa-sms-challenge")) return;

      let countdownInterval = null;

      function findResendButton() {
        return document.querySelector('button[value="resend-code"]') ||
          document.querySelector('._link-resend-code');
      }

      function startCooldown(btn) {
        if (!btn) return;

        let remaining = RESEND_COOLDOWN_SEC;
        const form = btn.closest('form');

        // Create countdown span if not exists
        let countdownSpan = document.getElementById('resend-countdown');
        if (!countdownSpan) {
          countdownSpan = document.createElement('span');
          countdownSpan.id = 'resend-countdown';
          countdownSpan.style.cssText = 'color: var(--font-light-color, #666); font-size: inherit;';
          btn.parentNode.insertBefore(countdownSpan, btn);
        }

        // Hide button, show countdown
        btn.style.display = 'none';
        countdownSpan.style.display = 'inline';
        countdownSpan.textContent = `Renvoyer après ${remaining} secondes`;

        // Clear any existing interval
        if (countdownInterval) clearInterval(countdownInterval);

        countdownInterval = setInterval(() => {
          remaining--;
          if (remaining > 0) {
            countdownSpan.textContent = `Renvoyer après ${remaining} secondes`;
          } else {
            clearInterval(countdownInterval);
            countdownInterval = null;
            countdownSpan.style.display = 'none';
            btn.style.display = '';
          }
        }, 1000);
      }

      // Wait for button to appear (Auth0 renders dynamically)
      const findInterval = setInterval(() => {
        const btn = findResendButton();
        if (btn) {
          clearInterval(findInterval);

          // Start cooldown immediately on page load
          startCooldown(btn);

          // On click, let form submit then restart cooldown
          btn.addEventListener('click', function () {
            setTimeout(() => {
              const newBtn = findResendButton();
              if (newBtn) startCooldown(newBtn);
            }, 100);
          });
        }
      }, 100);

      // Stop searching after 10s
      setTimeout(() => clearInterval(findInterval), 10000);
    });
  </script>
