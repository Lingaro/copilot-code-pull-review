<script>
  function validateIfNotEmpty(a, e, t) {
    return !e || "" != a.value;
  }
</script>

<div class="ulp-field" id="id-gender-select-menu-container">
  <fieldset>
    <span class="formFieldsLable">Sexe</span>
    <div id="gender">
      <label class="form__field radio-button__wrapper" for="female" tabindex="0">
        <input type="radio" id="female" name="ulp-gender" value="F" required />
        <span class="radio-button__title">Femme</span>
        <span class="radio-button__item"></span>
      </label>
      <br />
      <label class="form__field radio-button__wrapper" for="male" tabindex="0">
        <input type="radio" id="male" name="ulp-gender" value="M" />
        <span class="radio-button__title">Homme</span>
        <span class="radio-button__item"></span>
      </label>
      <br />

      <label class="form__field radio-button__wrapper" for="prefer-not-to-say" tabindex="0">
        <input type="radio" id="prefer-not-to-say" name="ulp-gender" value="O" />
        <span class="radio-button__title">Autre</span>
        <span class="radio-button__item"></span>
      </label>
    </div>
  </fieldset>
  <div class="ulp-error-info" id="id-error-gender-select-container" data-ulp-validation-function="validateIfNotEmpty"
    data-ulp-validation-event-listeners="blur,change,input,focus">
    Failed
  </div>
</div>


<div class="ulp-field " id="id-first-name-container">
  <span for="firstName" class="formFieldsLable">firstName</span>
  <input class="ulp-first-name-input" type="text" name="ulpfirstname" id="firstName" placeholder="Ex. Marie"
    required />
  <div class="ulp-error-info" id="id-error-first-name-container" data-ulp-validation-function="validateIfNotEmpty"
    data-ulp-validation-event-listeners="blur,change,input,focus">
    failed
  </div>
</div>

<div class="ulp-field ulp-last-name-container" id="id-last-name-container">
  <span class="ulp-last-name-label formFieldsLable" for="lastName" >lastName</span>
  <input class="ulp-last-name-input" type="text" name="ulp-last-name" id="lastName" placeholder="Nom" required />
  <div class="ulp-error-info" id="id-error-last-name-container" data-ulp-validation-function="validateIfNotEmpty"
    data-ulp-validation-event-listeners="blur,change,input,focus">
    Failed
  </div>
</div>
